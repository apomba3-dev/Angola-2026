<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angola 2026</title>
    <!-- Configuração PWA para iPhone e Android -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Angola 2026">
    <link rel="manifest" href="manifest.json">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #2c0505; 
            color: #ffffff; 
        }
        header { 
            background: #090d16; 
            color: #ffffff; 
            padding: 12px 15px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 2px solid #1e3a8a;
        }
        .header-left { display: flex; align-items: center; gap: 8px; }
        .header-right { display: flex; align-items: center; }
        h1 { margin: 0; font-size: 1.05rem; text-align: center; flex-grow: 1; color: #93c5fd; font-weight: bold; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        
        .search-box-container { display: flex; gap: 6px; margin-bottom: 12px; }
        .search-box-container input[type="text"] { flex-grow: 1; margin-bottom: 0; background: #151c2f; color: #ffffff; border: 1px solid #3b82f6; font-size: 1rem; }
        .search-box-container input[type="text"]::placeholder { color: #94a3b8; }
        .search-action-btn { width: auto; padding: 0 16px; margin-bottom: 0; background: #1d4ed8; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; border: none; color: white; }
        .search-action-btn:active { background: #1e3a8a; }

        input[type="password"], input[type="number"], input[type="file"], select, textarea, button { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid #3b82f6; border-radius: 8px; box-sizing: border-box; font-size: 1rem; background: #151c2f; color: #ffffff; }
        input::placeholder, textarea::placeholder { color: #94a3b8; }
        textarea { resize: vertical; height: 100px; font-family: inherit; }
        button { background: #1d4ed8; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:active { background: #1e3a8a; }
        
        .tabs-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        
        .tab-btn { 
            background: #151c2f; 
            color: #93c5fd; 
            border: 1px solid #3b82f6; 
            padding: 8px 14px; 
            border-radius: 20px; 
            font-size: 0.85rem; 
            font-weight: bold; 
            cursor: pointer; 
            width: auto; 
            margin-bottom: 0; 
            flex-shrink: 0;
            transition: all 0.2s ease-in-out;
        }
        .tab-btn:active, .tab-btn.active { 
            background: #1d4ed8; 
            color: white; 
            transform: scale(0.96);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.9);
        }

        #listaArtigos {
            opacity: 1;
            transition: opacity 0.3s ease-in-out;
            list-style: none; 
            padding: 0;
        }
        .fade-out { opacity: 0; }

        /* Animação suave para o bloco especial da imagem e legenda */
        .fade-imagem-container {
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }
        .fade-imagem-container.visivel {
            opacity: 1;
        }

        li { background: #151c2f; color: #ffffff; padding: 15px; margin-bottom: 8px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.4); cursor: pointer; border: 1px solid #1e3a8a; }
        li strong { color: #ffffff; font-size: 1.05rem; }
        
        .menu-btn { background: #1d4ed8; border: 1px solid #60a5fa; color: white; font-size: 0.9rem; font-weight: bold; padding: 8px 10px; border-radius: 6px; width: auto; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .menu-btn:active { background: #1e3a8a; }
        .submenu-right-btn { background: #1d4ed8; border: 1px solid #60a5fa; color: white; font-size: 0.9rem; font-weight: bold; padding: 8px 10px; border-radius: 6px; width: auto; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); z-index: 9999; justify-content: center; align-items: center; margin: 0; padding: 15px; box-sizing: border-box; }
        
        .modal-content { background: rgba(255, 255, 255, 0.90); color: #1e293b; padding: 20px 15px; border-radius: 10px; width: 100%; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: left; box-sizing: border-box; max-height: 85vh; overflow-y: auto; border: 1px solid rgba(203, 213, 225, 0.9); backdrop-filter: blur(5px); }
        .modal-content h2 { color: #1e3a8a; font-size: 1.15rem; margin-top: 0; }
        .modal-content hr { border: 0; border-top: 1px solid #e2e8f0; margin: 10px 0; }
        .modal-content p { color: #334155; }
        
        .modal-content input, .modal-content select, .modal-content textarea { background: rgba(248, 250, 252, 0.9); color: #0f172a; border: 1px solid #cbd5e1; }
        .modal-content input::placeholder, .modal-content textarea::placeholder { color: #94a3b8; }
        
        .badge { background: #1e3a8a; color: #93c5fd; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; border: 1px solid #3b82f6; display: inline-block; margin-top: 5px; }
        .iban-box { background: #020617; padding: 12px; border: 1px dashed #60a5fa; border-radius: 6px; word-break: break-all; font-family: monospace; font-size: 0.95rem; margin: 10px 0; color: #93c5fd; }
        .whatsapp-btn { background: #059669 !important; color: white !important; }
        .call-btn { background: #0284c7 !important; color: white !important; }
        .danger-btn { background: #dc2626 !important; color: white !important; }
        .secondary-btn { background: #64748b !important; color: #ffffff !important; }
        
        #toastNotificacao {
            visibility: hidden;
            min-width: 220px;
            background-color: #1e293b;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            z-index: 10000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            border: 1px solid #3b82f6;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            font-size: 0.9rem;
            font-weight: bold;
        }
        #toastNotificacao.mostrar {
            visibility: visible;
            animation: fadeInOut 2.5s ease-in-out;
        }
        @keyframes fadeInOut {
            0% { bottom: 0px; opacity: 0; }
            15% { bottom: 30px; opacity: 1; }
            85% { bottom: 30px; opacity: 1; }
            100% { bottom: 0px; opacity: 0; }
        }

        .log-box { background: #020617; border: 1px solid #1e3a8a; padding: 8px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 5px; font-family: monospace; color: #e2e8f0; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button class="menu-btn" onclick="reproduzirSomAbrir(); abrirSubmenuDireito()">☰ Menu</button>
        </div>
        <h1>🇦🇴 Angola 2026</h1>
        <div class="header-right">
            <button class="submenu-right-btn" onclick="reproduzirSomAbrir(); abrirFormularioAdicionar()">➕ Adicionar</button>
        </div>
    </header>

    <div class="container">
        <div class="search-box-container">
            <input type="text" id="inputPesquisa" placeholder="Pesquisar artigos ou pesquisar na web..." oninput="filtrar()" onkeypress="pesquisarWeb(event)">
            <button class="search-action-btn" onclick="reproduzirSomClique(); executarPesquisaBotao()" title="Pesquisar na Web">🔎</button>
        </div>
        
        <div class="tabs-container">
            <button class="tab-btn active" onclick="filtrarPorAba('Todas', this)">🔄 Todas</button>
            <button class="tab-btn" onclick="filtrarPorAba('História', this)">📜 História</button>
            <button class="tab-btn" onclick="filtrarPorAba('Cidadania', this)">🇦🇴 Patriotismo</button>
            <button class="tab-btn" onclick="filtrarPorAba('Instituições', this)">🏛️ Política</button>
            <button class="tab-btn" onclick="filtrarPorAba('Administração', this)">📋 Adm. Pública</button>
            <button class="tab-btn" onclick="filtrarPorAba('Minint', this)">🛡️ MININT</button>
            <button class="tab-btn" onclick="filtrarPorAba('Música', this)">🎵 Músicas</button>
            <button class="tab-btn" onclick="filtrarPorAba('Imagens', this)">🖼️ Imagens</button>
        </div>

        <ul id="listaArtigos"></ul>
    </div>

    <div id="toastNotificacao">Mensagem de aviso</div>

    <div id="modal" class="modal">
        <div class="modal-content" id="modalConteudo"></div>
    </div>

    <script src="dados.js"></script>

    <script>
        const MEU_TITULAR = "Artur Jamba Pomba";
        const MEU_BANCO = "Banco (BFA/BAI/Outro)";
        const MEU_IBAN = "000600009715277030196";
        const MEU_TELEFONE = "+244 944 048 287";
        const SENHA_ADMIN_OFICIAL = "admin2026";

        let listaFiltrada = [];
        let adminAutenticado = false;
        let estadoTodasOculto = false;
        let temporizadorInatividade;
        const TEMPO_LIMITE_MINUTOS = 3;

        // ------------------------------------------
        // SISTEMA COMPLETO DE ÁUDIO (Web Audio API)
        // ------------------------------------------
        function reproduzirSomClique() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) { console.log("Áudio não suportado."); }
        }

        function reproduzirSomEspecial() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch (e) { console.log("Áudio não suportado."); }
        }

        function reproduzirSomAbrir() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) { console.log("Áudio não suportado."); }
        }

        function reproduzirSomFechar() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) { console.log("Áudio não suportado."); }
        }

        function reproduzirSomSucesso() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioCtx.currentTime;
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, now);
                gain1.gain.setValueAtTime(0.15, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.1);

                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(783.99, now + 0.1);
                gain2.gain.setValueAtTime(0.15, now + 0.1);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.1);
                osc2.stop(now + 0.25);
            } catch (e) { console.log("Áudio não suportado."); }
        }

        function reproduzirSomErro() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const now = audioCtx.currentTime;
                const criarTomAlerta = (tempoInicio, frequencia) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(frequencia, tempoInicio);
                    gain.gain.setValueAtTime(0.12, tempoInicio);
                    gain.gain.exponentialRampToValueAtTime(0.01, tempoInicio + 0.08);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(tempoInicio);
                    osc.stop(tempoInicio + 0.08);
                };
                criarTomAlerta(now, 180);
                criarTomAlerta(now + 0.1, 140);
            } catch (e) { console.log("Áudio não suportado."); }
        }

        function reiniciarTemporizadorInatividade() {
            clearTimeout(temporizadorInatividade);
            if (adminAutenticado) {
                temporizadorInatividade = setTimeout(() => {
                    adminAutenticado = false;
                    mostrarToast("Sessão de administrador terminada por inatividade.");
                    let modal = document.getElementById("modal");
                    if (modal && modal.style.display === "flex") {
                        fecharJanelaModal();
                    }
                }, TEMPO_LIMITE_MINUTOS * 60 * 1000);
            }
        }

        window.addEventListener("mousemove", reiniciarTemporizadorInatividade);
        window.addEventListener("click", reiniciarTemporizadorInatividade);
        window.addEventListener("keypress", reiniciarTemporizadorInatividade);
        window.addEventListener("touchstart", reiniciarTemporizadorInatividade);

        function mostrarToast(mensagem) {
            const toast = document.getElementById("toastNotificacao");
            toast.innerText = mensagem;
            toast.className = "mostrar";
            setTimeout(() => {
                toast.className = toast.className.replace("mostrar", "");
            }, 2500);
        }

        let db;
        const requestDB = indexedDB.open("AngolaAppDB", 3);

        requestDB.onerror = function(event) {
            console.log("Erro ao abrir a base de dados IndexedDB");
        };

        requestDB.onsuccess = function(event) {
            db = event.target.result;
            carregarArtigosExtras();
        };

        requestDB.onupgradeneeded = function(event) {
            let dbConnection = event.target.result;
            if (!dbConnection.objectStoreNames.contains("musicas")) {
                dbConnection.createObjectStore("musicas", { keyPath: "id", autoIncrement: true });
            }
            if (!dbConnection.objectStoreNames.contains("pastas")) {
                dbConnection.createObjectStore("pastas", { keyPath: "id", autoIncrement: true });
            }
            if (!dbConnection.objectStoreNames.contains("imagens")) {
                dbConnection.createObjectStore("imagens", { keyPath: "id", autoIncrement: true });
            }
            if (!dbConnection.objectStoreNames.contains("artigos_extras")) {
                dbConnection.createObjectStore("artigos_extras", { keyPath: "id", autoIncrement: true });
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            inicializarDadosBase();
            verificarSessaoUtilizador();
            configurarBotaoTodasDuploClique();
        });

        function inicializarDadosBase() {
            if (typeof dados === 'undefined') {
                window.dados = [];
            }
            const jaTemPolitica = dados.some(d => d.titulo.includes("Política Geral"));
            if (!jaTemPolitica) {
                dados.push({
                    titulo: "Política Geral em Angola: Funcionamento e Organização",
                    categoria: "Instituições",
                    conteudo: "A política geral de Angola rege-se pelos princípios do Estado Democrático e de Direito, consagrados na Constituição. O sistema político é de cariz presidencialista, onde o Presidente da República assume cumulativamente as funções de Chefe de Estado, Chefe do Executivo e Comandante-em-Chef das Forças Armadas. O Poder Legislativo é exercido pela Assembleia Nacional, um parlamento unicameral encarregue de legislar, aprovar o Orçamento Geral do Estado e fiscalizar a governação. A organização política baseia-se ainda na administração descentralizada através dos governos provinciais e das administrações municipais e locais, promovendo a participação cidadã e o desenvolvimento regional."
                });
            }
            const jaTemMinint = dados.some(d => d.titulo.includes("MININT"));
            if (!jaTemMinint) {
                dados.push({
                    titulo: "Como Funciona o MININT (Ministério do Interior)",
                    categoria: "Minint",
                    conteudo: "O Ministério do Interior (MININT) é o departamento ministerial auxiliar do Presidente da República encarregue de garantir a segurança pública, a ordem interna, a tranquilidade e a proteção das fronteiras nacionais. O seu funcionamento articula-se através de vários órgãos executivos centrais fundamentais, destacando-se: a Polícia Nacional de Angola (PNA), responsável pela manutenção da ordem pública; o Serviço de Investigação Criminal (SIC), focado no combate à criminalidade e investigação de delitos; o Serviço de Migração e Estrangeiros (SME), que controla o movimento migratório e fronteiriço; e o Serviço Penitenciário, responsável pela gestão e reinserção social nas unidades prisionais. O MININT coordena ainda a vertente da Proteção Civil e Bombeiros, atuando na prevenção e socorro em situações de calamidades."
                });
            }

            const jaTemMusicaApp = dados.some(d => d.categoria === "Música");
            if (!jaTemMusicaApp) {
                dados.push({
                    titulo: "Módulo de Músicas Pessoais",
                    categoria: "Música",
                    conteudo: "Crie pastas personalizadas, organize e reproduza as suas músicas favoritas de forma permanente no seu dispositivo.",
                    isPlayerModulo: true
                });
            }

            const jaTemImagensApp = dados.some(d => d.categoria === "Imagens");
            if (!jaTemImagensApp) {
                dados.push({
                    titulo: "Módulo de Imagens Pessoais",
                    categoria: "Imagens",
                    conteudo: "Guarde e visualize as suas fotografias e imagens favoritas de forma permanente no seu telemóvel.",
                    isGaleriaModulo: true
                });
            }

            listaFiltrada = [...dados];
            carregarLista(listaFiltrada);
        }

        function carregarArtigosExtras() {
            if (!db) return;
            let transaction = db.transaction(["artigos_extras"], "readonly");
            let store = transaction.objectStore("artigos_extras");
            let req = store.getAll();
            req.onsuccess = function(e) {
                let extras = e.target.result;
                if (extras && extras.length > 0) {
                    extras.forEach(artigo => {
                        if (!dados.some(d => d.titulo === artigo.titulo)) {
                            dados.push(artigo);
                        }
                    });
                    listaFiltrada = [...dados];
                    carregarLista(listaFiltrada);
                }
            };
        }

        // --- LÓGICA DO BOTÃO "TODAS" (Com imagem, margens zero, legenda com sombra e transição) ---
        function configurarBotaoTodasDuploClique() {
            const botoesAba = document.querySelectorAll('.tab-btn');
            botoesAba.forEach(btn => {
                if (btn.innerText.includes("Todas")) {
                    btn.onclick = () => {
                        reproduzirSomEspecial();

                        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        document.getElementById("inputPesquisa").value = "";

                        const ul = document.getElementById("listaArtigos");
                        ul.classList.add("fade-out");

                        setTimeout(() => {
                            if (!estadoTodasOculto) {
                                ul.innerHTML = `
                                    <li style='text-align:center; background:transparent; border:none; box-shadow:none; padding: 0; margin-left: -15px; margin-right: -15px; width: calc(100% + 30px);'>
                                        <div id="blocoImagemEspecial" class="fade-imagem-container">
                                            <p style='color:#cbd5e1; margin-bottom:10px; padding: 0 15px;'>Frases ocultadas.</p>
                                            <div style='padding: 0 15px;'>
                                                <img src='7415.png' alt='Imagem Oculta' style='max-width:100%; max-height:200px; border-radius:8px; border:1px solid #3b82f6;'>
                                            </div>
                                            <div style='background: rgba(15, 23, 42, 0.95); border-top: 1px solid #3b82f6; border-bottom: 1px solid #3b82f6; padding: 12px 20px; margin-top: 12px; width: 100%; box-sizing: border-box; text-align: left;'>
                                                <p style='color: #facc15; font-size: 0.9rem; font-weight: bold; margin: 0; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);'>Legenda a tocar nas bordas do ecrã</p>
                                            </div>
                                        </div>
                                    </li>`;
                                
                                mostrarToast("Frases ocultadas e imagem exibida!");
                                estadoTodasOculto = true;

                                setTimeout(() => {
                                    const blocoEspecial = document.getElementById("blocoImagemEspecial");
                                    if (blocoEspecial) blocoEspecial.classList.add("visivel");
                                }, 50);

                            } else {
                                listaFiltrada = [...dados];
                                carregarLista(listaFiltrada);
                                mostrarToast("Frases restauradas!");
                                estadoTodasOculto = false;
                            }
                            ul.classList.remove("fade-out");
                        }, 150);
                    };
                }
            });
        }

        function verificarSessaoUtilizador() {
            let sessaoAtiva = localStorage.getItem("sessao_ativa");
            if (sessaoAtiva !== "true") {
                let jaCadastrado = localStorage.getItem("utilizador_cadastrado");
                if (jaCadastrado === "true") {
                    mostrarEcraLogin();
                } else {
                    mostrarEcraCadastro();
                }
            }
        }

        function mostrarEcraCadastro() {
            abrirJanelaFixa(`
                <h2>🇦🇴 Angola 2026</h2>

        function concluirCadastro() {
            const nome = document.getElementById("nomeRegisto").value.trim();
            const contacto = document.getElementById("contactoRegisto").value.trim();
            const senha = document.getElementById("senhaRegisto").value.trim();

            if (nome === "" || contacto === "" || senha === "") {
                reproduzirSomErro();
                mostrarToast("Preencha todos os campos!");
                return;
            }

            if (senha.length < 6) {
                reproduzirSomErro();
                mostrarToast("A senha deve ter 6+ carateres.");
                return;
            }

            localStorage.setItem("utilizador_cadastrado", "true");
            localStorage.setItem("utilizador_nome", nome);
            localStorage.setItem("utilizador_contacto", contacto);
            localStorage.setItem("utilizador_senha", senha);
            localStorage.setItem("sessao_ativa", "true");

            let acessos = JSON.parse(localStorage.getItem("angola_acessos_log")) || [];
            acessos.push({ dataHora: new Date().toLocaleString("pt-PT"), perfil: `${nome} (${contacto})` });
            localStorage.setItem("angola_acessos_log", JSON.stringify(acessos));

            fecharJanela();
            mostrarToast("Conta criada com sucesso!");
        }

        function filtrar() {
            if (typeof dados === 'undefined') return;
            estadoTodasOculto = false;
            const termo = document.getElementById("inputPesquisa").value.toLowerCase().trim();
            if (termo === "") {
                listaFiltrada = [...dados];
            } else {
                listaFiltrada = dados.filter(d => 
                    d.titulo.toLowerCase().includes(termo) || 
                    d.conteudo.toLowerCase().includes(termo) || 
                    d.categoria.toLowerCase().includes(termo)
                );
            }
            carregarLista(listaFiltrada);
        }

        function filtrarPorAba(categoriaFiltro, elementoBotao) {
            reproduzirSomClique();
            if (categoriaFiltro === 'Todas' && estadoTodasOculto) {
                return;
            }
            estadoTodasOculto = false;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            elementoBotao.classList.add('active');
            document.getElementById("inputPesquisa").value = "";

            if (typeof dados === 'undefined') return;

            if (categoriaFiltro === 'Todas') {
                listaFiltrada = [...dados];
            } else {
                listaFiltrada = dados.filter(d => d.categoria.toLowerCase() === categoriaFiltro.toLowerCase());
            }
            carregarLista(listaFiltrada);
        }

        function guardarNovoArtigo() {
            const titulo = document.getElementById("novoTitulo").value.trim();

            let storePastas = transaction.objectStore("pastas");

            let reqMusicas = storeMusicas.getAll();
            let reqPastas = storePastas.getAll();

            reqMusicas.onsuccess = function(eMusicas) {
                let musicasSalvas = eMusicas.target.result;

                reqPastas.onsuccess = function(ePastas) {
                    let pastasSalvas = ePastas.target.result;

                    let htmlMusicas = `<h2>🎵 Gestor de Músicas</h2>`;
                    
                    htmlMusicas += `<div style="display:flex; gap:6px; margin-bottom:10px;">`;
                    htmlMusicas += `<button onclick="tentarFazerUploadMusica()" style="background:#059669; font-size:0.9rem; margin-bottom:0; padding:10px; flex-grow:1;">➕ Enviar Música</button>`;

                    htmlMusicas += `</div>`;

                    if (pastaAbertaNome) {
                        htmlMusicas += `<button onclick="abrirLeitorMusica()" class="secondary-btn" style="padding:8px; margin-bottom:8px;">⬅️ Voltar às Pastas</button>`;
                        htmlMusicas += `<h3>📁 ${pastaAbertaNome}</h3>`;

                        let musicasDaPasta = musicasSalvas.filter(m => m.pasta === pastaAbertaNome);
                        if (musicasDaPasta.length === 0) {
                            htmlMusicas += `<p style="font-size:0.85rem; color:#64748b;">Nenhuma música nesta pasta.</p>`;
                        } else {
                            musicasDaPasta.forEach(m => {
                                htmlMusicas += `<div class="log-box" style="display:flex; justify-content:space-between; align-items:center;">`;
                                htmlMusicas += `<span style="word-break:break-all; max-width:65%;">🎵 ${m.nome}</span>`;
                                htmlMusicas += `<div style="display:flex; gap:4px;">`;
                                htmlMusicas += `<button onclick="tocarAudioBase64('${m.dados}', '${m.nome}')" style="background:#059669; padding:6px 10px; margin-bottom:0; font-size:0.8rem;">▶️ Tocar</button>`;
                                htmlMusicas += `<button onclick="abrirPainelAdmin(function apagarMusicaAdmin() { eliminarMusica(${m.id}); })" class="danger-btn" style="padding:6px 10px; margin-bottom:0; font-size:0.8rem;">🗑️</button>`;
                                htmlMusicas += `</div></div>`;
                            });
                        }
                    } else {
                        htmlMusicas += `<p style="font-size:0.85rem; color:#475569;">As tuas pastas e músicas guardadas:</p>`;
                        
                        if (pastasSalvas.length > 0) {
                            htmlMusicas += `<h4 style="color:#1e3a8a; margin:5px 0;">Pastas</h4>`;
                            pastasSalvas.forEach(p => {
                                htmlMusicas += `<div class="log-box" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="abrirLeitorMusica('${p.nome}')">`;
                                htmlMusicas += `<span>📁 ${p.nome}</span>`;
                                htmlMusicas += `<button onclick="event.stopPropagation(); abrirPainelAdmin(function apagarPastaAdmin() { eliminarPasta(${p.id}); })" class="danger-btn" style="padding:4px 8px; margin-bottom:0; font-size:0.75rem;">🗑️</button>`;
                                htmlMusicas += `</div>`;
                            });
                        }

                        let musicasSoltas = musicasSalvas.filter(m => !m.pasta);
                        if (musicasSoltas.length > 0) {
                            htmlMusicas += `<h4 style="color:#1e3a8a; margin:10px 0 5px 0;">Músicas Gerais</h4>`;
                            musicasSoltas.forEach(m => {
                                htmlMusicas += `<div class="log-box" style="display:flex; justify-content:space-between; align-items:center;">`;
                                htmlMusicas += `<span style="word-break:break-all; max-width:65%;">🎵 ${m.nome}</span>`;

        function tentarFazerUploadMusica() {
            abrirPainelAdmin(function executarUploadMusica() {
                let input = document.createElement('input');
                input.type = 'file';
                input.accept = 'audio/*';
                input.onchange = e => {
                    let file = e.target.files[0];
                    if (!file) return;

                    let reader = new FileReader();
                    reader.onload = function(event) {
                        let base64Data = event.target.result;
                        let transaction = db.transaction(["musicas"], "readwrite");
                        let store = transaction.objectStore("musicas");
                        let req = store.add({ nome: file.name, dados: base64Data, pasta: null });

                        req.onsuccess = function() {
                            reproduzirSomSucesso();
                            mostrarToast("Música adicionada com sucesso!");
                            abrirLeitorMusica();
                        };
                    };
                    reader.readAsDataURL(file);
                };
                input.click();
            });
        }
