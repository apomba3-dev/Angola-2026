<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angola 2026</title>
    <!-- Configuração PWA para iPhone e Android -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Angola 2026">
    <link rel="manifest" href="manifest.json">
    <style>
        /* Fundo Geral e Texto do Ecrã Principal - Dark Vermelho com letra nítida */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #2c0505; /* Vermelho escuro profundo e elegante */
            color: #ffffff; /* Letra totalmente branca para máxima nitidez */
        }
        
        /* Cabeçalho com Preto e Azul */
        header { 
            background: #090d16; /* Preto azulado profundo */
            color: #ffffff; 
            padding: 12px 15px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 2px solid #1e3a8a;
        }
        .header-left { display: flex; align-items: center; gap: 8px; }
        .header-right { display: flex; align-items: center; }
        h1 { margin: 0; font-size: 1.05rem; text-align: center; flex-grow: 1; color: #93c5fd; font-weight: bold; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        
        /* Caixa de Pesquisa com excelente contraste */
        .search-box-container { display: flex; gap: 6px; margin-bottom: 12px; }
        .search-box-container input[type="text"] { flex-grow: 1; margin-bottom: 0; background: #151c2f; color: #ffffff; border: 1px solid #3b82f6; font-size: 1rem; }
        .search-box-container input[type="text"]::placeholder { color: #94a3b8; }
        .search-action-btn { width: auto; padding: 0 16px; margin-bottom: 0; background: #1d4ed8; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; border: none; color: white; }
        .search-action-btn:active { background: #1e3a8a; }

        input[type="password"], input[type="number"], textarea, button { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid #3b82f6; border-radius: 8px; box-sizing: border-box; font-size: 1rem; background: #151c2f; color: #ffffff; }
        input::placeholder, textarea::placeholder { color: #94a3b8; }
        textarea { resize: vertical; height: 100px; font-family: inherit; }
        button { background: #1d4ed8; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:active { background: #1e3a8a; }
        
        /* Abas de Navegação Rápida por Temas */
        .tabs-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        .tab-btn { background: #151c2f; color: #93c5fd; border: 1px solid #3b82f6; padding: 8px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; cursor: pointer; width: auto; margin-bottom: 0; flex-shrink: 0; }
        .tab-btn:active, .tab-btn.active { background: #1d4ed8; color: white; }

        ul { list-style: none; padding: 0; }
        li { background: #151c2f; color: #ffffff; padding: 15px; margin-bottom: 8px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.4); cursor: pointer; border: 1px solid #1e3a8a; }
        li strong { color: #ffffff; font-size: 1.05rem; }
        
        /* Botões de Menu nos Cantos (Azul e Preto) */
        .menu-btn { background: #1d4ed8; border: 1px solid #60a5fa; color: white; font-size: 0.9rem; font-weight: bold; padding: 8px 10px; border-radius: 6px; width: auto; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .menu-btn:active { background: #1e3a8a; }
        .submenu-right-btn { background: #1d4ed8; border: 1px solid #60a5fa; color: white; font-size: 0.9rem; font-weight: bold; padding: 8px 10px; border-radius: 6px; width: auto; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        
        /* Ecrã Total (Modais e Menus em Azul Escuro e Preto) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); z-index: 9999; justify-content: center; align-items: center; margin: 0; padding: 15px; box-sizing: border-box; }
        .modal-content { background: #0b1120; color: #ffffff; padding: 30px 20px; border-radius: 12px; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); text-align: left; box-sizing: border-box; max-height: 90vh; overflow-y: auto; border: 1px solid #3b82f6; }
        .modal-content h2 { color: #93c5fd; }
        .modal-content hr { border: 0; border-top: 1px solid #1e3a8a; margin: 15px 0; }
        
        .badge { background: #1e3a8a; color: #93c5fd; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; border: 1px solid #3b82f6; display: inline-block; margin-top: 5px; }
        .iban-box { background: #020617; padding: 12px; border: 1px dashed #60a5fa; border-radius: 6px; word-break: break-all; font-family: monospace; font-size: 0.95rem; margin: 10px 0; color: #93c5fd; }
        .whatsapp-btn { background: #059669 !important; }
        .call-btn { background: #0284c7 !important; }
        .danger-btn { background: #dc2626 !important; }
        .secondary-btn { background: #334155 !important; color: #f8fafc !important; }
        
        .chat-box { background: #020617; border-radius: 8px; height: 180px; overflow-y: auto; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #1e3a8a; }
        .msg-user { background: #1d4ed8; color: white; align-self: flex-end; padding: 8px 12px; border-radius: 8px; max-width: 80%; font-size: 0.9rem; word-break: break-word; }
        .msg-dev { background: #1e293b; color: #f8fafc; align-self: flex-start; padding: 8px 12px; border-radius: 8px; max-width: 80%; font-size: 0.9rem; border: 1px solid #334155; word-break: break-word; }
        .log-box { background: #020617; border: 1px solid #1e3a8a; padding: 8px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 5px; font-family: monospace; color: #e2e8f0; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <!-- Menu Principal no Canto Superior Esquerdo -->
            <button class="menu-btn" onclick="abrirMenu()">☰ Menu</button>
        </div>
        <h1>🇦🇴 Angola 2026</h1>
        <div class="header-right">
            <!-- Submenu no Canto Superior Direito -->
            <button class="submenu-right-btn" onclick="abrirSubmenuDireito()">⚙️ Opções</button>
        </div>
    </header>

    <div class="container">
        <!-- Barra de Pesquisa com o Botão 🔎 integrado -->
        <div class="search-box-container">
            <input type="text" id="inputPesquisa" placeholder="Pesquisar artigos ou perguntar à IA..." oninput="filtrar()" onkeypress="pesquisarWeb(event)">
            <button class="search-action-btn" onclick="executarPesquisaBotao()" title="Pesquisar">🔎</button>
        </div>
        
        <!-- Barra de Abas de Navegação Rápida -->
        <div class="tabs-container">
            <button class="tab-btn active" onclick="filtrarPorAba('Todas', this)">🔄 Todas</button>
            <button class="tab-btn" onclick="filtrarPorAba('História', this)">📜 História</button>
            <button class="tab-btn" onclick="filtrarPorAba('Cidadania', this)">🇦🇴 Patriotismo</button>
            <button class="tab-btn" onclick="filtrarPorAba('Instituições', this)">🏛️ Política</button>
            <button class="tab-btn" onclick="filtrarPorAba('Administração', this)">📋 Adm. Pública</button>
            <button class="tab-btn" onclick="filtrarPorAba('Minint', this)">🛡️ MININT</button>
        </div>

        <ul id="listaArtigos"></ul>
    </div>

    <!-- Modal / Ecrã Total com Menus em Azul e Preto -->
    <div id="modal" class="modal">
        <div class="modal-content" id="modalConteudo"></div>
    </div>

    <!-- Puxa os artigos do ficheiro separado dados.js -->
    <script src="dados.js"></script>

    <script>
        const MEU_TITULAR = "Artur Jamba Pomba";
        const MEU_BANCO = "Banco (BFA/BAI/Outro)";
        const MEU_IBAN = "000600009715277030196";
        const MEU_TELEFONE = "+244 944 048 287";

        let listaFiltrada = [];

        // Injeção automática dos novos conteúdos de Política e MININT caso não estejam no dados.js
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof dados !== 'undefined') {
                const jaTemPolitica = dados.some(d => d.titulo.includes("Política Geral"));
                if (!jaTemPolitica) {
                    dados.push({
                        titulo: "Política Geral em Angola: Funcionamento e Organização",
                        categoria: "Instituições",
                        conteudo: "A política geral de Angola rege-se pelos princípios do Estado Democrático e de Direito, consagrados na Constituição. O sistema político é de cariz presidencialista, onde o Presidente da República assume cumulativamente as funções de Chefe de Estado, Chefe do Executivo e Comandante-em-Chefe das Forças Armadas. O Poder Legislativo é exercido pela Assembleia Nacional, um parlamento unicameral encarregue de legislar, aprovar o Orçamento Geral do Estado e fiscalizar a governação. A organização política baseia-se ainda na administração descentralizada através dos governos provinciais e das administrações municipais e locais, promovendo a participação cidadã e o desenvolvimento regional."
                    });
                }
                const jaTemMinint = dados.some(d => d.titulo.includes("MININT"));
                if (!jaTemMinint) {
                    dados.push({
                        titulo: "Como Funciona o MININT (Ministério do Interior)",
                        categoria: "Minint",
                        conteudo: "O Ministério do Interior (MININT) é o departamento ministerial auxiliar do Presidente da República encarregue de garantir a segurança pública, a ordem interna, a tranquilidade e a proteção das fronteiras nacionais. O seu funcionamento articula-se através de vários órgãos executivos centrais fundamentais, destacando-se: a Polícia Nacional de Angola (PNA), responsável pela manutenção da ordem pública; o Serviço de Investigação Criminal (SIC), focado no combate à criminalidade e investigação de delitos; o Serviço de Migração e Estrangeiros (SME), que controla o movimento migratório e fronteiriço; e o Serviço Penitenciário, responsável pela gestão e reinserção social nas unidades prisionais. O MININT coordena ainda a vertente da Proteção Civil e Bombeiros, atuando na prevenção e socorro em situações de calamidades."
                    });
                }

                listaFiltrada = [...dados];
                carregarLista(listaFiltrada);
            }
            verificarSessaoUtilizador();
        });

        function verificarSessaoUtilizador() {
            let sessaoAtiva = localStorage.getItem("sessao_ativa");
            if (sessaoAtiva !== "true") {
                let jaCadastrado = localStorage.getItem("utilizador_cadastrado");
                if (jaCadastrado === "true") {
                    mostrarEcraLogin();
                } else {
                    mostrarEcraCadastro();
                }
            }
        }

        function mostrarEcraCadastro() {
            abrirJanelaFixa(`
                <h2>🇦🇴 Angola 2026</h2>
                <hr>
                <p style="font-size: 0.95rem; color: #cbd5e1; margin-bottom: 15px;">Efetue o seu registo para aceder à aplicação:</p>
                <input type="text" id="nomeRegisto" placeholder="O seu Nome Completo">
                <input type="text" id="contactoRegisto" placeholder="O seu Número / WhatsApp">
                <input type="password" id="senhaRegisto" placeholder="Crie uma Senha (Mínimo 6 caracteres)">
                <button onclick="concluirCadastro()" style="margin-top: 5px;">Criar Conta</button>
            `);
        }

        function concluirCadastro() {
            const nome = document.getElementById("nomeRegisto").value.trim();
            const contacto = document.getElementById("contactoRegisto").value.trim();
            const senha = document.getElementById("senhaRegisto").value.trim();

            if (nome === "" || contacto === "" || senha === "") {
                alert("Por favor, preencha todos os campos.");
                return;
            }

            if (senha.length < 6) {
                alert("Por segurança, a senha deve ter pelo menos 6 caracteres.");
                return;
            }

            localStorage.setItem("utilizador_cadastrado", "true");
            localStorage.setItem("utilizador_nome", nome);
            localStorage.setItem("utilizador_contacto", contacto);
            localStorage.setItem("utilizador_senha", senha);
            localStorage.setItem("sessao_ativa", "true");

            let acessos = JSON.parse(localStorage.getItem("angola_acessos_log")) || [];
            acessos.push({ dataHora: new Date().toLocaleString("pt-PT"), perfil: `${nome} (${contacto})` });
            localStorage.setItem("angola_acessos_log", JSON.stringify(acessos));

            fecharJanela();

            if (confirm("Pretende notificar o criador (Artur) sobre o seu registo via WhatsApp?")) {
                let urlZap = `https://wa.me/244944048287?text=` + encodeURIComponent(`Olá Artur, registei-me na app Angola 2026.\nNome: ${nome}\nContacto: ${contacto}`);
                window.open(urlZap, '_blank');
            }
        }

        function mostrarEcraLogin() {
            let nomeSalvo = localStorage.getItem("utilizador_nome") || "Utilizador";
            abrirJanelaFixa(`
                <h2>🔐 Bem-vindo de volta, ${nomeSalvo}</h2>
                <hr>
                <p style="font-size: 0.95rem; color: #cbd5e1; margin-bottom: 15px;">Insira a sua senha de acesso:</p>
                <input type="password" id="senhaLogin" placeholder="Digite a sua senha">
                <button onclick="validarLogin()" style="margin-top: 5px;">Entrar</button>
                <button onclick="esqueciMinhaSenha()" class="whatsapp-btn" style="margin-top: 5px;">💬 Esqueci-me da Senha</button>
            `);
        }

        function validarLogin() {
            const senhaDigitada = document.getElementById("senhaLogin").value.trim();
            const senhaSalva = localStorage.getItem("utilizador_senha");

            if (!senhaDigitada) {
                alert("Por favor, digite a senha.");
                return;
            }

            if (senhaDigitada === senhaSalva) {
                localStorage.setItem("sessao_ativa", "true");
                fecharJanela();
            } else {
                alert("Senha incorreta! Tente novamente.");
            }
        }

        function fecharJanela() {
            document.getElementById("modal").style.display = "none";
        }

        function esqueciMinhaSenha() {
            let nomeSalvo = localStorage.getItem("utilizador_nome") || "Utilizador Desconhecido";
            let contactoSalvo = localStorage.getItem("utilizador_contacto") || "Sem contacto";
            let urlZap = `https://wa.me/244944048287?text=` + encodeURIComponent(`Olá Artur, esqueci-me da senha da app Angola 2026.\nO meu nome é: ${nomeSalvo}\nContacto: ${contactoSalvo}`);
            window.open(urlZap, '_blank');
        }

        function abrirJanelaFixa(html) {
            document.getElementById("modalConteudo").innerHTML = html;
            document.getElementById("modal").style.display = "flex";
        }

        function carregarLista(itens) {
            const ul = document.getElementById("listaArtigos");
            ul.innerHTML = "";
            if (!itens || itens.length === 0) {
                ul.innerHTML = "<li style='text-align:center; color:#cbd5e1;'>Nenhum resultado local encontrado. Escreve a tua pergunta na barra acima e clica em 🔎 para consultar o assistente!</li>";
                return;
            }
            itens.forEach((item) => {
                const li = document.createElement("li");
                li.innerHTML = `<strong>${item.titulo}</strong><br><span class="badge">${item.categoria}</span>`;
                li.onclick = () => mostrarDetalhes(item);
                ul.appendChild(li);
            });
        }

        function filtrar() {
            if (typeof dados === 'undefined') return;
            const termo = document.getElementById("inputPesquisa").value.toLowerCase().trim();
            if (termo === "") {
                listaFiltrada = [...dados];
            } else {
                listaFiltrada = dados.filter(d => 
                    d.titulo.toLowerCase().includes(termo) || 
                    d.conteudo.toLowerCase().includes(termo) || 
                    d.categoria.toLowerCase().includes(termo)
                );
            }
            carregarLista(listaFiltrada);
        }

        function filtrarPorAba(categoriaFiltro, elementoBotao) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            elementoBotao.classList.add('active');
            document.getElementById("inputPesquisa").value = "";

            if (typeof dados === 'undefined') return;

            if (categoriaFiltro === 'Todas') {
                listaFiltrada = [...dados];
            } else {
                listaFiltrada = dados.filter(d => d.categoria.toLowerCase() === categoriaFiltro.toLowerCase());
            }
            carregarLista(listaFiltrada);
        }

        function pesquisarWeb(e) {
            if (e.key === 'Enter') {
                executarPesquisaBotao();
            }
        }

        async function executarPesquisaBotao() {
            const termo = document.getElementById("inputPesquisa").value.trim();
            if (!termo) return;
            
            const termoLower = termo.toLowerCase();

            abrirJanelaModal(`
                <h2>✨ Assistente Inteligente</h2>
                <hr>
                <p><b>Pesquisa:</b> ${termo}</p>
                <p id="resultadoWebTexto" style="color: #e2e8f0; line-height: 1.6;">A processar a resposta...</p>
                <br>
                <button onclick="fecharJanelaModal()" class="secondary-btn">Fechar</button>
            `);

            try {
                let respostaIA = "";

                if (termoLower.includes("artur jamba pomba") || (termoLower.includes("artur") && termoLower.includes("pomba"))) {
                    respostaIA = `<b>Artur Jamba Pomba</b><br><br>` +
                                 `- <b>Origem:</b> Angolana<br>` +
                                 `- <b>Data de Nascimento:</b> 22/11/1999<br>` +
                                 `- <b>Percurso Escolar:</b> Frequentou as escolas do Liceu Dr. A. A. Neto, na província da Huíla.<br>` +
                                 `- <b>Realização:</b> Criador da aplicação <b>Angola 2026</b>, desenvolvida para facilitar os estudos e a história de Angola.`;
                } else if (termoLower.includes("presidente") && termoLower.includes("angola")) {
                    respostaIA = "Atualmente, o Presidente da República de Angola é João Lourenço, que lidera o poder executivo do país.";
                } else if (termoLower.includes("capital")) {
                    respostaIA = "A capital de Angola é Luanda, sendo também o principal centro financeiro, cultural e político do país.";
                } else if (termoLower.includes("população") || termoLower.includes("habitantes")) {
                    respostaIA = "Angola possui uma população estimada em mais de 35 milhões de habitantes, sendo uma das populações mais jovens do continente africano.";
                } else {
                    respostaIA = `Com base na questão "<b>${termo}</b>", este tema está associado ao contexto socioeconómico, histórico ou institucional de Angola. Podes explorar mais detalhes nos artigos disponíveis na página principal ou detalhar a tua dúvida no chat com o programador.`;
                }

                const textoElemento = document.getElementById("resultadoWebTexto");
                if (textoElemento) {
                    textoElemento.innerHTML = `${respostaIA}<br><br><small style="color:#93c5fd;">✨ Processado pelo Assistente Inteligente</small>`;
                }
            } catch (error) {
                console.error('Erro na pesquisa inteligente:', error);
                const textoElemento = document.getElementById("resultadoWebTexto");
                if (textoElemento) {
                    textoElemento.innerHTML = "Ocorreu um erro ao processar a resposta. Tente novamente.";
                }
            }
        }

        function mostrarDetalhes(item) {
            abrirJanelaModal(`
                <h2>${item.titulo}</h2>
                <p><span class="badge">${item.categoria}</span></p>
                <hr>
                <p style="line-height: 1.6; color: #f1f5f9;">${item.conteudo}</p>
                <br>
                <button onclick="fecharJanelaModal()">Fechar</button>
            `);
        }

        function abrirEstatisticasAcessos() {
            let acessos = JSON.parse(localStorage.getItem("angola_acessos_log")) || [];
            let htmlLogs = `<h2>📊 Utilizadores Registados</h2><p style="font-size:0.85rem; color:#94a3b8;">Pessoas que fizeram o cadastro neste dispositivo:</p><hr>`;
            if (acessos.length === 0) {
                htmlLogs += `<p>Sem registos disponíveis.</p>`;
            } else {
                acessos.reverse().forEach((log, index) => {
                    htmlLogs += `<div class="log-box"><b>#${acessos.length - index}</b> - ${log.perfil || 'Acesso geral'} <br><small>${log.dataHora}</small></div>`;
                });
            }
            htmlLogs += `<br><button onclick="limparLogs()" class="danger-btn">Apagar Registos</button><button onclick="abrirSubmenuDireito()" class="secondary-btn">Voltar ao Submenu</button>`;
            abrirJanelaModal(htmlLogs);
        }

        function limparLogs() {
            if (confirm("Pretende limpar os registos?")) {
                localStorage.removeItem("angola_acessos_log");
                abrirEstatisticasAcessos();
            }
        }

        function abrirMenu() {
            abrirJanelaModal(`
                <h2>☰ Menu Principal</h2>
                <hr>
                <button onclick="abrirSubmenuSaude()">🩺 Opções de Saúde</button>
                <button onclick="abrirChat()">💬 Chat com o Desenvolvedor</button>
                <br>
                <button onclick="fecharJanelaModal()" class="danger-btn">Fechar Menu</button>
            `);
        }

        function abrirSubmenuDireito() {
            abrirJanelaModal(`
                <h2>⚙️ Submenu & Ferramentas</h2>
                <hr>
                <button onclick="infoDev()">ℹ Sobre o Desenvolvedor</button>
                <button onclick="infoIban()">💳 Consultar IBAN (Apoio)</button>
                <button onclick="abrirEstatisticasAcessos()">📊 Ver Utilizadores Registados</button>
                <button onclick="abrirAjudaFeedback()">❓ Ajuda e Feedback</button>
                <br>
                <button onclick="fecharJanelaModal()" class="danger-btn">Fechar Submenu</button>
            `);
        }

        function abrirAjudaFeedback() {
            abrirJanelaModal(`
                <h2>❓ Ajuda e Feedback</h2>
                <p style="font-size: 0.9rem; color: #cbd5e1; line-height: 1.4;">
                    <b>Como usar a app:</b><br>
                    - Use as abas no topo para filtrar por temas.<br>
                    - Escreva qualquer pergunta na barra de pesquisa e clique no botão 🔎 para obter respostas automáticas na hora.<br>
                </p>
                <hr>
                <p style="font-size: 0.9rem; color: #cbd5e1;">Deixe aqui o seu comentário ou sugestão:</p>
                <textarea id="textoFeedback" placeholder="Escreva a sua mensagem ou sugestão de melhoria..."></textarea>
                <button onclick="enviarFeedback()" class="whatsapp-btn">💬 Enviar Feedback por WhatsApp</button>
                <br>
                <button onclick="abrirSubmenuDireito()" class="secondary-btn">⬅ Voltar ao Submenu</button>
            `);
        }

        function enviarFeedback() {
            const texto = document.getElementById("textoFeedback").value.trim();
            if (texto === "") {
                alert("Por favor, escreva alguma mensagem antes de enviar.");
                return;
            }
            let nomeUtilizador = localStorage.getItem("utilizador_nome") || "Utilizador";
            let urlZap = `https://wa.me/244944048287?text=` + encodeURIComponent(`Feedback da app Angola 2026\nDe: ${nomeUtilizador}\n\nMensagem: ${texto}`);
            window.open(urlZap, '_blank');
        }

        function abrirSubmenuSaude() {
            abrirJanelaModal(`
                <h2>🩺 Opções de Saúde</h2>
                <p style="font-size: 0.9rem; color: #cbd5e1;">Escolha uma das opções abaixo:</p>
                <hr>
                <button onclick="calcMed()">💊 Módulo: Dosagens</button>
                <button onclick="infoSaude('🦟 Paludismo (Malária)', 'O paludismo é prevalente em Angola. Sintomas incluem febre alta e calafrios. Use redes mosqueteiras.')">🦟 Guia: Paludismo</button>
                <button onclick="infoSaude('🎗 SIDA / HIV', 'A prevenção inclui preservativos, testagem regular e uso de antirretrovirais (ARV).')">🎗 Informação: HIV/SIDA</button>
                <br>
                <button onclick="abrirMenu()" class="secondary-btn">⬅ Voltar ao Menu Principal</button>
            `);
        }

        function abrirChat() {
            abrirJanelaModal(`
                <h2>💬 Chat com o Desenvolvedor</h2>
                <div class="chat-box" id="chatHistorico"></div>
                <input type="text" id="mensagemInput" placeholder="Escreve a tua mensagem...">
                <button onclick="enviarMensagemChat()">Enviar</button>
                <button onclick="abrirMenu()" class="secondary-btn">Voltar ao Menu Principal</button>
            `);
            carregarConversasBD();
        }

        function carregarConversasBD() {
            const historicoDiv = document.getElementById("chatHistorico");
            if (!historicoDiv) return;
            let conversas = JSON.parse(localStorage.getItem("angola_chat_db")) || [];
            if (conversas.length === 0) {
                historicoDiv.innerHTML = `<div class="msg-dev">Escreve uma mensagem para falar com o Artur.</div>`;
                return;
            }
            historicoDiv.innerHTML = "";
            conversas.forEach(msg => {
                historicoDiv.innerHTML += `<div class="${msg.tipo === 'user' ? 'msg-user' : 'msg-dev'}">${msg.texto}</div>`;
            });
            historicoDiv.scrollTop = historicoDiv.scrollHeight;
        }

        function enviarMensagemChat() {
            const input = document.getElementById("mensagemInput");
            const texto = input.value.trim();
            if (texto === "") return;
            let conversas = JSON.parse(localStorage.getItem("angola_chat_db")) || [];
            conversas.push({ tipo: "user", texto: texto });
            conversas.push({ tipo: "dev", texto: "Mensagem guardada! Podes encaminhar para o WhatsApp do Artur." });
            localStorage.setItem("angola_chat_db", JSON.stringify(conversas));
            input.value = "";
            carregarConversasBD();
            let nomeUtilizador = localStorage.getItem("utilizador_nome") || "Desconhecido";
            let zapUrl = `https://wa.me/244944048287?text=` + encodeURIComponent(`Mensagem de ${nomeUtilizador}: ${texto}`);
            const historicoDiv = document.getElementById("chatHistorico");
            historicoDiv.innerHTML += `<button class="whatsapp-btn" onclick="window.open('${zapUrl}', '_blank')">💬 Enviar para o WhatsApp</button>`;
            historicoDiv.scrollTop = historicoDiv.scrollHeight;
        }

        function calcMed() {
            abrirJanelaModal(`
                <h2>💊 Calculador de Dosagens</h2>
                <input type="number" id="peso" placeholder="Peso (kg)">
                <input type="number" id="dose" placeholder="Dose (mg/kg)">
                <input type="number" id="conc" placeholder="Concentração (mg/ml) [Opcional]">
                <button onclick="executarCalculo()">Calcular</button>
                <button onclick="abrirSubmenuSaude()" class="secondary-btn">Voltar às Opções</button>
            `);
        }

        function executarCalculo() {
            const peso = parseFloat(document.getElementById("peso").value);
            const dose = parseFloat(document.getElementById("dose").value);
            const conc = parseFloat(document.getElementById("conc").value);
            if (!isNaN(peso) && !isNaN(dose)) {
                let total = peso * dose;
                let res = `<h2>📊 Resultado</h2><hr><p><b>Dose Total:</b> ${total.toFixed(2)} mg</p>`;
                if (!isNaN(conc) && conc > 0) res += `<p><b>Volume:</b> ${(total/conc).toFixed(2)} ml</p>`;
                res += `<br><button onclick="calcMed()">Novo</button><button onclick="abrirSubmenuSaude()" class="secondary-btn">Voltar às Opções</button>`;
                abrirJanelaModal(res);
            } else {
                alert("Preencha valores válidos.");
            }
        }

        function infoSaude(titulo, msg) {
            abrirJanelaModal(`<h2>${titulo}</h2><hr><p style="color: #f1f5f9;">${msg}</p><br><button onclick="abrirSubmenuSaude()" class="secondary-btn">Voltar às Opções</button>`);
        }

        function infoDev() {
            let meuNomeCadastrado = localStorage.getItem("utilizador_nome") || "Utilizador";
            abrirJanelaModal(`
                <h2>👨‍💻 Sobre o Desenvolvedor</h2>
                <hr><p style="color: #f1f5f9;"><b>Desenvolvedor:</b> ${MEU_TITULAR}<br><b>Contacto:</b> ${MEU_TELEFONE}</p>
                <button class="whatsapp-btn" onclick="window.open('https://wa.me/244944048287?text=` + encodeURIComponent(`Olá Artur, sou o/a ${meuNomeCadastrado} e contacto através da app Angola 2026.`) + `', '_blank')">💬 Conversar via WhatsApp</button>
                <button class="call-btn" onclick="window.location.href='tel:${MEU_TELEFONE}'">📞 Ligar</button>
                <br><br><button onclick="abrirSubmenuDireito()" class="secondary-btn">Voltar ao Submenu</button>
            `);
        }

        function infoIban() {
            abrirJanelaModal(`<h2>💳 Apoie o Projeto</h2><hr><p><b>IBAN:</b></p><div class="iban-box">${MEU_IBAN}</div><br><button onclick="abrirSubmenuDireito()" class="secondary-btn">Voltar ao Submenu</button>`);
        }

        function abrirJanelaModal(html) {
            document.getElementById("modalConteudo").innerHTML = html;
            document.getElementById("modal").style.display = "flex";
        }

        function fecharJanelaModal() {
            if (localStorage.getItem("utilizador_cadastrado") === "true" && localStorage.getItem("sessao_ativa") === "true") {
                document.getElementById("modal").style.display = "none";
            } else {
                alert("Por favor, preencha o seu cadastro primeiro para entrar.");
            }
        }
    </script>
</body>
</html>
