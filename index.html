<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angola 2026</title>
    <!-- Configuração PWA para iPhone e Android -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Angola 2026">
    <link rel="manifest" href="manifest.json">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #2c0505; 
            color: #ffffff; 
        }
        header { 
            background: #090d16; 
            color: #ffffff; 
            padding: 12px 15px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 2px solid #1e3a8a;
        }
        .header-left { display: flex; align-items: center; gap: 8px; }
        .header-right { display: flex; align-items: center; }
        h1 { margin: 0; font-size: 1.05rem; text-align: center; flex-grow: 1; color: #93c5fd; font-weight: bold; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        
        .search-box-container { display: flex; gap: 6px; margin-bottom: 12px; }
        .search-box-container input[type="text"] { flex-grow: 1; margin-bottom: 0; background: #151c2f; color: #ffffff; border: 1px solid #3b82f6; font-size: 1rem; }
        .search-box-container input[type="text"]::placeholder { color: #94a3b8; }
        .search-action-btn { width: auto; padding: 0 16px; margin-bottom: 0; background: #1d4ed8; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; border: none; color: white; }
        .search-action-btn:active { background: #1e3a8a; }

        input[type="password"], input[type="number"], input[type="file"], textarea, button { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid #3b82f6; border-radius: 8px; box-sizing: border-box; font-size: 1rem; background: #151c2f; color: #ffffff; }
        input::placeholder, textarea::placeholder { color: #94a3b8; }
        textarea { resize: vertical; height: 100px; font-family: inherit; }
        button { background: #1d4ed8; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:active { background: #1e3a8a; }
        
        .tabs-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        
        /* Abas com efeito de destaque e transição */
        .tab-btn { 
            background: #151c2f; 
            color: #93c5fd; 
            border: 1px solid #3b82f6; 
            padding: 8px 14px; 
            border-radius: 20px; 
            font-size: 0.85rem; 
            font-weight: bold; 
            cursor: pointer; 
            width: auto; 
            margin-bottom: 0; 
            flex-shrink: 0;
            transition: all 0.2s ease-in-out;
        }
        .tab-btn:active, .tab-btn.active { 
            background: #1d4ed8; 
            color: white; 
            transform: scale(0.96);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.9);
        }

        /* Transição suave de desvanecimento para a lista */
        #listaArtigos {
            opacity: 1;
            transition: opacity 0.3s ease-in-out;
            list-style: none; 
            padding: 0;
        }
        .fade-out {
            opacity: 0;
        }

        /* Estilo idêntico ao .modal-content para a página principal */
        li { 
            background: rgba(255, 255, 255, 0.90); 
            color: #1e293b; 
            padding: 15px; 
            margin-bottom: 10px; 
            border-radius: 10px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            cursor: pointer; 
            border: 1px solid rgba(203, 213, 225, 0.9); 
            backdrop-filter: blur(5px);
        }
        li strong { color: #1e3a8a; font-size: 1.05rem; }
        
        .menu-btn { background: #1d4ed8; border: 1px solid #60a5fa; color: white; font-size: 0.9rem; font-weight: bold; padding: 8px 10px; border-radius: 6px; width: auto; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .menu-btn:active { background: #1e3a8a; }
        .submenu-right-btn { background: #1d4ed8; border: 1px solid #60a5fa; color: white; font-size: 0.9rem; font-weight: bold; padding: 8px 10px; border-radius: 6px; width: auto; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); z-index: 9999; justify-content: center; align-items: center; margin: 0; padding: 15px; box-sizing: border-box; }
        
        /* Pop-up transparente e translúcido */
        .modal-content { background: rgba(255, 255, 255, 0.90); color: #1e293b; padding: 20px 15px; border-radius: 10px; width: 100%; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: left; box-sizing: border-box; max-height: 85vh; overflow-y: auto; border: 1px solid rgba(203, 213, 225, 0.9); backdrop-filter: blur(5px); }
        .modal-content h2 { color: #1e3a8a; font-size: 1.15rem; margin-top: 0; }
        .modal-content hr { border: 0; border-top: 1px solid #e2e8f0; margin: 10px 0; }
        .modal-content p { color: #334155; }
        
        .modal-content input, .modal-content select, .modal-content textarea { background: rgba(248, 250, 252, 0.9); color: #0f172a; border: 1px solid #cbd5e1; }
        .modal-content input::placeholder, .modal-content textarea::placeholder { color: #94a3b8; }
        
        .badge { background: #1e3a8a; color: #93c5fd; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; border: 1px solid #3b82f6; display: inline-block; margin-top: 5px; }
        .iban-box { background: #020617; padding: 12px; border: 1px dashed #60a5fa; border-radius: 6px; word-break: break-all; font-family: monospace; font-size: 0.95rem; margin: 10px 0; color: #93c5fd; }
        .whatsapp-btn { background: #059669 !important; color: white !important; }
        .call-btn { background: #0284c7 !important; color: white !important; }
        .danger-btn { background: #dc2626 !important; color: white !important; }
        .secondary-btn { background: #64748b !important; color: #ffffff !important; }
        
        #toastNotificacao {
            visibility: hidden;
            min-width: 220px;
            background-color: #1e293b;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            z-index: 10000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            border: 1px solid #3b82f6;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            font-size: 0.9rem;
            font-weight: bold;
        }
        #toastNotificacao.mostrar {
            visibility: visible;
            animation: fadeInOut 2.5s ease-in-out;
        }
        @keyframes fadeInOut {
            0% { bottom: 0px; opacity: 0; }
            15% { bottom: 30px; opacity: 1; }
            85% { bottom: 30px; opacity: 1; }
            100% { bottom: 0px; opacity: 0; }
        }

        .chat-box { background: #020617; border-radius: 8px; height: 180px; overflow-y: auto; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #1e3a8a; }
        .log-box { background: #020617; border: 1px solid #1e3a8a; padding: 8px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 5px; font-family: monospace; color: #e2e8f0; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button class="menu-btn" onclick="abrirMenu()">☰ Menu</button>
        </div>
        <h1>🇦🇴 Angola 2026</h1>
        <div class="header-right">
            <button class="submenu-right-btn" onclick="abrirSubmenuDireito()">⚙️ Opções</button>
        </div>
    </header>

    <div class="container">
        <div class="search-box-container">
            <input type="text" id="inputPesquisa" placeholder="Pesquisar artigos ou pesquisar na web..." oninput="filtrar()" onkeypress="pesquisarWeb(event)">
            <button class="search-action-btn" onclick="executarPesquisaBotao()" title="Pesquisar na Web">🔎</button>
        </div>
        
        <!-- Abas com todas as categorias solicitadas -->
        <div class="tabs-container">
            <button class="tab-btn active" onclick="filtrarPorAba('Todas', this)">🔄 Todas</button>
            <button class="tab-btn" onclick="filtrarPorAba('História', this)">📜 História</button>
            <button class="tab-btn" onclick="filtrarPorAba('Cidadania', this)">🇦🇴 Cidadania</button>
            <button class="tab-btn" onclick="filtrarPorAba('Instituições', this)">🏛️ Instituições</button>
            <button class="tab-btn" onclick="filtrarPorAba('Organização do Estado', this)">🏛️ Organização do Estado</button>
            <button class="tab-btn" onclick="filtrarPorAba('Administração', this)">📋 Administração</button>
            <button class="tab-btn" onclick="filtrarPorAba('Minint', this)">🛡️ Ministério do Interior</button>
        </div>

        <ul id="listaArtigos"></ul>

        <!-- Container da imagem fo.png ocupando o ecrã completo com botão de download -->
        <div id="containerImagemOculta" style="display: none; text-align: center; margin-top: 5px;">
            <img id="imagemFundoPrincipal" src="fo.png" alt="Imagem Oculta" style="width: 100%; max-height: 70vh; object-fit: contain; border-radius: 8px; border: 1px solid rgba(203, 213, 225, 0.9); box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: block; margin: 0 auto;">
            <p style="margin-top: 15px; font-size: 1.25rem; font-weight: bold; color: #93c5fd; text-shadow: 0 2px 4px rgba(0,0,0,0.6);">📚 Continua a estudar</p>
            <button onclick="baixarImagemAtual()" style="margin-top: 10px; background: #059669; padding: 12px; font-size: 1rem; border-radius: 8px; font-weight: bold; cursor: pointer;">📥 Baixar Imagem</button>
        </div>
    </div>

    <div id="toastNotificacao">Mensagem de aviso</div>

    <div id="modal" class="modal">
        <div class="modal-content" id="modalConteudo"></div>
    </div>

    <script>
        const MEU_TITULAR = "Artur Jamba Pomba";
        const MEU_BANCO = "Banco (BFA/BAI/Outro)";
        const MEU_IBAN = "000600009715277030196";
        const MEU_TELEFONE = "+244 944 048 287";
        const SENHA_ADMIN_OFICIAL = "admin2026";

        let listaFiltrada = [];
        let adminAutenticado = false;
        let estadoTodasOculto = false;
        let deferredPrompt = null;
        let temporizadorInatividade;
        const TEMPO_LIMITE_MINUTOS = 3;

        // Capturar o evento de instalação do PWA
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            mostrarToast("App pronto para instalar!");
        });

        // Base de dados interna completa
        let dados = [
            {
                titulo: "História de Angola: Da Resistência à Independência",
                categoria: "História",
                conteudo: "A história de Angola é marcada por séculos de resistência contra a colonização portuguesa, culminando na Luta Armada de Libertação Nacional liderada pelos movimentos independentistas. A independência nacional foi proclamada a 11 de novembro de 1975 pelo Dr. Agostinho Neto, primeiro Presidente de Angola."
            },
            {
                titulo: "Símbolos Nacionais e Cidadania",
                categoria: "Cidadania",
                conteudo: "A cidadania angolana rege-se pelos deveres e direitos fundamentais consagrados na Constituição. Os Símbolos Nacionais de Angola são a Bandeira Nacional (com as cores vermelha, preta e o emblema da roda dentada, machete e estrela), a Insígnia da República e o Hino Nacional ('Angola Avante')."
            },
            {
                titulo: "Instituições da República de Angola",
                categoria: "Instituições",
                conteudo: "As instituições da República de Angola fundamentam-se no respeito pela Constituição e pela lei, estruturando-se com base no princípio da separação de poderes e interdependência de funções. Os órgãos de soberania são o Presidente da República, a Assembleia Nacional e os Tribunais. O Presidente da República é o Chefe de Estado, Titular do Poder Executivo e Comandante-em-Chefe das Forças Armadas Angolanas (FAA). A Assembleia Nacional constitui o parlamento unicameral, responsável pela função legislativa, aprovação do Orçamento Geral do Estado e fiscalização política da governação. Os Tribunais administram a justiça em nome do povo, destacando-se o Tribunal Supremo, o Tribunal Constitucional e o Tribunal de Contas."
            },
            {
                titulo: "Organização do Estado Angolano",
                categoria: "Organização do Estado",
                conteudo: "O Estado angolano organiza-se sob a forma de uma República unitária e presidencialista. O poder político está estruturado com base no princípio da separação de poderes entre o Executivo (liderado pelo Presidente da República), o Legislativo (Assembleia Nacional) e o Judicial (Tribunais)."
            },
            {
                titulo: "Administração Pública em Angola",
                categoria: "Administração",
                conteudo: "A Administração Pública em Angola visa assegurar a satisfação das necessidades coletivas dos cidadãos, estruturando-se de forma descentralizada através dos órgãos da administração central, governos provinciais, administrações municipais e comunais."
            },
            {
                titulo: "Ministério do Interior (MININT)",
                categoria: "Minint",
                conteudo: "O Ministério do Interior (MININT) é o departamento ministerial encarregue de formular, coordenar e executar a política de segurança pública, manutenção da ordem interna, garantia da tranquilidade e proteção das fronteiras nacionais. O MININT opera através de vários órgãos executivos centrais especializados: a Polícia Nacional de Angola (PNA), encarregue da ordem pública e segurança das populações; o Serviço de Investigação Criminal (SIC), vocacionado para o combate à criminalidade e investigação de infrações penais; o Serviço de Migração e Estrangeiros (SME), responsável pelo controlo do movimento migratório e fronteiriço; o Serviço Penitenciário, que assegura a execução das penas e a reinserção social; e o Serviço de Proteção Civil e Bombeiros, atuando na prevenção e socorro em casos de calamidades e sinistros."
            }
        ];

        function reiniciarTemporizadorInatividade() {
            clearTimeout(temporizadorInatividade);
            if (adminAutenticado) {
                temporizadorInatividade = setTimeout(() => {
                    adminAutenticado = false;
                    mostrarToast("Sessão de administrador terminada por inatividade.");
                    let modal = document.getElementById("modal");
                    if (modal && modal.style.display === "flex") {
                        fecharJanelaModal();
                    }
                }, TEMPO_LIMITE_MINUTOS * 60 * 1000);
            }
        }

        window.addEventListener("mousemove", reiniciarTemporizadorInatividade);
        window.addEventListener("click", reiniciarTemporizadorInatividade);
        window.addEventListener("keypress", reiniciarTemporizadorInatividade);
        window.addEventListener("touchstart", reiniciarTemporizadorInatividade);

        function mostrarToast(mensagem) {
            const toast = document.getElementById("toastNotificacao");
            toast.innerText = mensagem;
            toast.className = "mostrar";
            setTimeout(() => {
                toast.className = toast.className.replace("mostrar", "");
            }, 2500);
        }

        let db;
        const requestDB = indexedDB.open("AngolaAppDB", 4);

        requestDB.onerror = function(event) {
            console.log("Erro ao abrir a base de dados IndexedDB");
        };

        requestDB.onsuccess = function(event) {
            db = event.target.result;
        };

        requestDB.onupgradeneeded = function(event) {
            let dbConnection = event.target.result;
            if (!dbConnection.objectStoreNames.contains("musicas")) {
                dbConnection.createObjectStore("musicas", { keyPath: "id", autoIncrement: true });
            }
            if (!dbConnection.objectStoreNames.contains("pastas")) {
                dbConnection.createObjectStore("pastas", { keyPath: "id", autoIncrement: true });
            }
            if (!dbConnection.objectStoreNames.contains("imagens")) {
                dbConnection.createObjectStore("imagens", { keyPath: "id", autoIncrement: true });
            }
            if (!dbConnection.objectStoreNames.contains("videos")) {
                dbConnection.createObjectStore("videos", { keyPath: "id", autoIncrement: true });
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            listaFiltrada = [...dados];
            carregarLista(listaFiltrada);
            verificarSessaoUtilizador();
            configurarBotaoTodasDuploClique();
        });

        function configurarBotaoTodasDuploClique() {
            const botoesAba = document.querySelectorAll('.tab-btn');
            botoesAba.forEach(btn => {
                if (btn.innerText.includes("Todas")) {
                    btn.onclick = () => {
                        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        document.getElementById("inputPesquisa").value = "";

                        const ul = document.getElementById("listaArtigos");
                        const divImg = document.getElementById("containerImagemOculta");
                        ul.classList.add("fade-out");

                        setTimeout(() => {
                            if (!estadoTodasOculto) {
                                ul.style.display = "none";
                                divImg.style.display = "block";
                                mostrarToast("Frases ocultadas!");
                                estadoTodasOculto = true;
                            } else {
                                ul.style.display = "block";
                                listaFiltrada = [...dados];
                                carregarLista(listaFiltrada);
                                divImg.style.display = "none";
                                mostrarToast("Frases restauradas!");
                                estadoTodasOculto = false;
                            }
                            ul.classList.remove("fade-out");
                        }, 150);
                    };
                }
            });
        }

        function baixarImagemAtual() {
            const link = document.createElement('a');
            link.href = 'fo.png';
            link.download = 'fo.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            mostrarToast("A transferir imagem...");
        }

        function instalarAplicativo() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        mostrarToast("A instalar o aplicativo...");
                    }
                    deferredPrompt = null;
                });
            } else {
                mostrarToast("O app já está instalado ou o navegador não suporta.");
            }
        }

        function verificarSessaoUtilizador() {
            let sessaoAtiva = localStorage.getItem("sessao_ativa");
            if (sessaoAtiva !== "true") {
                let jaCadastrado = localStorage.getItem("utilizador_cadastrado");
                if (jaCadastrado === "true") {
                    mostrarEcraLogin();
                } else {
                    mostrarEcraCadastro();
                }
            }
        }

        function mostrarEcraCadastro() {
            abrirJanelaFixa(`
                <h2>🇦🇴 Angola 2026</h2>
                <hr>
                <p style="font-size: 0.9rem; margin-bottom: 12px;">Efetue o seu registo para aceder à aplicação:</p>
                <input type="text" id="nomeRegisto" placeholder="O seu Nome Completo">
                <input type="text" id="contactoRegisto" placeholder="O seu Número / WhatsApp">
                <input type="password" id="senhaRegisto" placeholder="Crie uma Senha (Mínimo 6)">
                <button onclick="concluirCadastro()" style="margin-top: 5px;">Criar Conta</button>
            `);
        }

        function concluirCadastro() {
            const nome = document.getElementById("nomeRegisto").value.trim();
            const contacto = document.getElementById("contactoRegisto").value.trim();
            const senha = document.getElementById("senhaRegisto").value.trim();

            if (nome === "" || contacto === "" || senha === "") {
                mostrarToast("Preencha todos os campos!");
                return;
            }

            if (senha.length < 6) {
                mostrarToast("A senha deve ter 6+ carateres.");
                return;
            }

            localStorage.setItem("utilizador_cadastrado", "true");
            localStorage.setItem("utilizador_nome", nome);
            localStorage.setItem("utilizador_contacto", contacto);
            localStorage.setItem("utilizador_senha", senha);
            localStorage.setItem("sessao_ativa", "true");

            let acessos = JSON.parse(localStorage.getItem("angola_acessos_log")) || [];
            acessos.push({ dataHora: new Date().toLocaleString("pt-PT"), perfil: `${nome} (${contacto})` });
            localStorage.setItem("angola_acessos_log", JSON.stringify(acessos));

            fecharJanela();
            mostrarToast("Conta criada com sucesso!");
        }

        function mostrarEcraLogin() {
            let nomeSalvo = localStorage.getItem("utilizador_nome") || "Utilizador";
            abrirJanelaFixa(`
                <h2>🔐 Bem-vindo, ${nomeSalvo}</h2>
                <hr>
                <p style="font-size: 0.9rem; margin-bottom: 12px;">Insira a sua senha de acesso:</p>
                <input type="password" id="senhaLogin" placeholder="Digite a sua senha">
                <button onclick="validarLogin()" style="margin-top: 5px;">Entrar</button>
                <button onclick="esqueciMinhaSenha()" class="whatsapp-btn" style="margin-top: 5px;">💬 Esqueci-me da Senha</button>
            `);
        }

        function validarLogin() {
            const senhaDigitada = document.getElementById("senhaLogin").value.trim();
            const senhaSalva = localStorage.getItem("utilizador_senha");

            if (!senhaDigitada) {
                mostrarToast("Digite a senha!");
                return;
            }

            if (senhaDigitada === senhaSalva) {
                localStorage.setItem("sessao_ativa", "true");
                fecharJanela();
                mostrarToast("Sessão iniciada!");
            } else {
                mostrarToast("Senha incorreta!");
            }
        }

        function fecharJanela() {
            adminAutenticado = false;
            document.getElementById("modal").style.display = "none";
        }

        function fecharJanelaModal() {
            adminAutenticado = false;
            if (localStorage.getItem("utilizador_cadastrado") === "true" && localStorage.getItem("sessao_ativa") === "true") {
                document.getElementById("modal").style.display = "none";
            } else {
                mostrarToast("Preencha o cadastro primeiro!");
            }
        }

        function esqueciMinhaSenha() {
            let nomeSalvo = localStorage.getItem("utilizador_nome") || "Utilizador Desconhecido";
            let contactoSalvo = localStorage.getItem("utilizador_contacto") || "Sem contacto";
            let urlZap = `https://wa.me/244944048287?text=` + encodeURIComponent(`Olá Artur, esqueci-me da senha da app Angola 2026.\nO meu nome é: ${nomeSalvo}\nContacto: ${contactoSalvo}`);
            window.open(urlZap, '_blank');
        }

        function abrirJanelaFixa(html) {
            document.getElementById("modalConteudo").innerHTML = html;
            document.getElementById("modal").style.display = "flex";
        }

        function carregarLista(itens) {
            const ul = document.getElementById("listaArtigos");
            ul.classList.add("fade-out");

            setTimeout(() => {
                ul.innerHTML = "";
                if (!itens || itens.length === 0) {
                    ul.innerHTML = "<li style='text-align:center; color:#1e293b; background: rgba(255, 255, 255, 0.90); border-radius: 10px;'>Nenhum resultado local encontrado. Escreve a tua pergunta na barra acima e clica em 🔎 para pesquisar na web!</li>";
                } else {
                    itens.forEach((item) => {
                        const li = document.createElement("li");
                        li.innerHTML = `<strong>${item.titulo}</strong><br><span class="badge">${item.categoria}</span>`;
                        li.onclick = () => mostrarDetalhes(item);
                        ul.appendChild(li);
                    });
                }
                ul.classList.remove("fade-out");
            }, 150);
        }

        function filtrar() {
            if (typeof dados === 'undefined') return;
            estadoTodasOculto = false;
            document.getElementById("containerImagemOculta").style.display = "none";
            document.getElementById("listaArtigos").style.display = "block";
            const termo = document.getElementById("inputPesquisa").value.toLowerCase().trim();
            if (termo === "") {
                listaFiltrada = [...dados];
            } else {
                listaFiltrada = dados.filter(d => 
                    d.titulo.toLowerCase().includes(termo) || 
                    d.conteudo.toLowerCase().includes(termo) || 
                    d.categoria.toLowerCase().includes(termo)
                );
            }
            carregarLista(listaFiltrada);
        }

        function filtrarPorAba(categoriaFiltro, elementoBotao) {
            if (categoriaFiltro === 'Todas' && estadoTodasOculto) {
                return;
            }
            estadoTodasOculto = false;
            document.getElementById("containerImagemOculta").style.display = "none";
            document.getElementById("listaArtigos").style.display = "block";
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            elementoBotao.classList.add('active');
            document.getElementById("inputPesquisa").value = "";

            if (typeof dados === 'undefined') return;

            if (categoriaFiltro === 'Todas') {
                listaFiltrada = [...dados];
            } else {
                listaFiltrada = dados.filter(d => d.categoria.toLowerCase() === categoriaFiltro.toLowerCase());
            }
            carregarLista(listaFiltrada);
        }

        // --- MÓDULO DE MÚSICA ---
        function abrirLeitorMusica(pastaAbertaNome = null) {
            if (!db) {

                return;
            }

            let transaction = db.transaction(["musicas", "pastas"], "readonly");
            let storeMusicas = transaction.objectStore("musicas");
            let storePastas = transaction.objectStore("pastas");

            let reqMusicas = storeMusicas.getAll();
            let reqPastas = storePastas.getAll();

            reqMusicas.onsuccess = function(eMusicas) {
                let musicasSalvas = eMusicas.target.result;

                reqPastas.onsuccess = function(ePastas) {
                    let pastasSalvas = ePastas.target.result;

                    let htmlMusicas = `<h2>🎵 Gestor de Músicas</h2>`;
                    
                    htmlMusicas += `<div style="display:flex; gap:6px; margin-bottom:10px;">`;
                    htmlMusicas += `<button onclick="tentarFazerUploadMusica()" style="background:#059669; font-size:0.9rem; margin-bottom:0; padding:10px; flex-grow:1;">➕ Enviar Música</button>`;
                    htmlMusicas += `<button onclick="tentarCriarPasta()" style="background:#0284c7; font-size:0.9rem; margin-bottom:0; padding:10px; flex-grow:1;">📁 Criar Pasta</button>`;
                    htmlMusicas += `</div>`;
                    htmlMusicas += `<hr><div style="max-height: 200px; overflow-y: auto;">`;

                    let todasAsPastasObj = { "Geral": [] };
                    let listaNomesPastas = ["Geral"];
                    if (pastasSalvas) {
                        pastasSalvas.forEach(p => { 
                            let nomeP = p.nome || p;
                            todasAsPastasObj[nomeP] = []; 
                            listaNomesPastas.push(nomeP);
                        });
                    }

                    musicasSalvas.forEach((musica) => {
                        let pUtilizador = musica.pasta || "Geral";
                        if (!todasAsPastasObj[pUtilizador]) {
                            todasAsPastasObj[pUtilizador] = [];
                        }
                        todasAsPastasObj[pUtilizador].push(musica);
                    });

                    for (let nomePasta in todasAsPastasObj) {
                        let listaNestaPasta = todasAsPastasObj[nomePasta];
                        let estaAberta = (pastaAbertaNome === nomePasta);

                        htmlMusicas += `<div style="background:rgba(248, 250, 252, 0.9); border:1px solid #cbd5e1; border-radius:6px; padding:8px; margin-bottom:8px;">`;
                        
                        htmlMusicas += `<div style="display:flex; justify-content:space-between; align-items:center;">`;
                        htmlMusicas += `<span onclick="abrirLeitorMusica('${estaAberta ? null : nomePasta}')" style="color:#1e3a8a; font-size:0.9rem; font-weight:bold; cursor:pointer; flex-grow:1;">📁 ${nomePasta} (${listaNestaPasta.length}) 🔽</span>`;
                        if (nomePasta !== "Geral") {
                            htmlMusicas += `<button onclick='tentarApagarPasta("${nomePasta}")' style="padding:2px 5px; margin:0; font-size:0.65rem; width:auto; background:#64748b;" title="Apagar">Apagar</button>`;
                        }
                        htmlMusicas += `</div>`;

                        if (estaAberta) {
                            htmlMusicas += `<hr style="border-top:1px solid #cbd5e1; margin:6px 0;">`;
                            if (listaNestaPasta.length === 0) {
                                htmlMusicas += `<p style="font-size:0.75rem; color:#64748b; margin:4px 0;">Pasta vazia.</p>`;
                            } else {
                                listaNestaPasta.forEach((musica) => {
                                    htmlMusicas += `<div style="background:#ffffff; border:1px solid #e2e8f0; padding:5px 6px; margin-bottom:4px; border-radius:4px; display:flex; justify-content:space-between; align-items:center;">
                                        <span style="font-size:0.8rem; color:#334155; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:120px;" title="${musica.nome}">🎶 ${musica.nome}</span>
                                        <div style="display: flex; gap: 3px;">
                                            <button onclick='reproduzirMusicaDB(${musica.id}, "${nomePasta}")' style="padding:2px 5px; margin:0; font-size:0.65rem; width:auto; background:#059669;" title="Ouvir">▶</button>
                                            <button onclick='tentarCopiarMusica(${musica.id}, "${nomePasta}", ${JSON.stringify(listaNomesPastas)})' style="padding:2px 5px; margin:0; font-size:0.65rem; width:auto; background:#0284c7;" title="Copiar">📋</button>
                                            <button onclick='tentarApagarMusica(${musica.id}, "${nomePasta}", "${musica.nome}")' style="padding:2px 5px; margin:0; font-size:0.65rem; width:auto; background:#dc2626;" title="Apagar">✕</button>
                                        </div>
                                    </div>`;
                                });
                            }
                        }
                        htmlMusicas += `</div>`;
                    }
                    htmlMusicas += `</div>`;
                    htmlMusicas += `<audio id="audioPlayer" controls style="width:100%; margin-top:8px; display:none;"></audio>`;

            abrirJanelaFixa(`

            `);
        }

        function apagarPasta(nomePasta) {
            let transaction = db.transaction(["pastas"], "readwrite");
            let store = transaction.objectStore("pastas");
            let req = store.openCursor();
            req.onsuccess = function(e) {
                let cursor = e.target.result;
                if (cursor) {
                    let pNome = cursor.value.nome || cursor.value;
                    if (pNome === nomePasta) {
                        store.delete(cursor.primaryKey);
                    } else {
                        cursor.continue();
                    }
                }
            };
            transaction.oncomplete = function() {
                mostrarToast(`Pasta removida!`);
                abrirLeitorMusica();
            };
        }

        function tentarCopiarMusica(idMusica, pastaAtual, todasAsPastas) {
            let pastasDisponiveis = todasAsPastas.filter(p => p !== pastaAtual);
            if (pastasDisponiveis.length === 0) {
                mostrarToast("Não há outras pastas.");
                return;
            }
            let textoOpcoes = "Escolha a pasta de destino:\n";
            pastasDisponiveis.forEach((p, index) => {
                textoOpcoes += `${index + 1} - ${p}\n`;
            });
            let escolha = prompt(textoOpcoes + "\nDigite o número ou nome:");
            if (!escolha) return;
            let pastaDestino = escolha.trim();
            if (!isNaN(pastaDestino) && pastaDestino > 0 && pastaDestino <= pastasDisponiveis.length) {
                pastaDestino = pastasDisponiveis[pastaDestino - 1];
            }
            if (!todasAsPastas.includes(pastaDestino)) {
                mostrarToast("Pasta inválida!");
                return;
            }
            let transaction = db.transaction(["musicas"], "readwrite");
            let store = transaction.objectStore("musicas");
            store.get(idMusica).onsuccess = function(e) {
                let musicaOriginal = e.target.result;
                if (!musicaOriginal) return;
                store.add({ nome: musicaOriginal.nome, pasta: pastaDestino, blob: musicaOriginal.blob }).onsuccess = function() {
                    mostrarToast(`Copiado para "${pastaDestino}"!`);
                    abrirLeitorMusica(pastaAtual);
                };
            };
        }

        function reproduzirMusicaDB(id) {
            db.transaction(["musicas"], "readonly").objectStore("musicas").get(id).onsuccess = function(event) {
                let musica = event.target.result;
                if (musica && musica.blob) {
                    const player = document.getElementById("audioPlayer");
                    player.src = URL.createObjectURL(musica.blob);
                    player.style.display = "block";
                    player.play();
                }
            };
        }

        }

        function tentarFazerUploadImagem() {
            if (!adminAutenticado) {
                abrirPainelAdmin(tentarFazerUploadImagem);
                return;
            }
            abrirJanelaFixa(`
                <h2>📤 Enviar Imagem</h2>
                <hr>
                <input type="text" id="tituloImagem" placeholder="Título da imagem" style="padding:10px; font-size:0.9rem; margin-bottom:8px;">
                <input type="file" id="ficheiroImagem" accept="image/*" style="margin-bottom:8px; font-size:0.9rem;">
                <button onclick="guardarImagemDB()" style="background:#059669; padding:10px; margin-bottom:6px;">Confirmar Envio</button>
                <button onclick="abrirGaleriaImagens()" class="secondary-btn" style="padding:10px;">Cancelar</button>
            `);
        }

        function guardarImagemDB() {
            const ficheiro = document.getElementById("ficheiroImagem").files[0];
            if (!ficheiro) {
                mostrarToast("Selecione um ficheiro de imagem!");
                return;
            }
            let titulo = document.getElementById("tituloImagem").value.trim();
            if (!titulo) titulo = ficheiro.name;

            let transaction = db.transaction(["imagens"], "readwrite");
            transaction.objectStore("imagens").add({ titulo: titulo, blob: ficheiro }).onsuccess = function() {
                mostrarToast("Imagem guardada!");
                abrirGaleriaImagens();
            };
        }

        function tentarApagarImagem(id, tituloImg) {
            if (!adminAutenticado) {
                abrirPainelAdmin(() => tentarApagarImagem(id, tituloImg));
                return;
            }
            abrirJanelaFixa(`
                <h2>⚠️ Eliminar Imagem</h2>
                <hr>
                <p style="font-size: 0.9rem; margin-bottom: 5px;">Pretende eliminar:</p>
                <p style="color: #1e3a8a; font-size: 0.85rem; font-weight: bold; margin-bottom: 15px; word-break: break-all;">📷 ${tituloImg}</p>
                <button onclick="apagarImagemDB(${id})" class="danger-btn" style="padding: 10px; margin-bottom: 6px;">Sim, Eliminar</button>
                <button onclick="abrirGaleriaImagens()" class="secondary-btn" style="padding: 10px;">Cancelar</button>
            `);
        }

        function apagarImagemDB(id) {
            let transaction = db.transaction(["imagens"], "readwrite");
            transaction.objectStore("imagens").delete(id).onsuccess = function() {
                mostrarToast("Imagem eliminada!");
                abrirGaleriaImagens();
            };
        }

        function verImagemCompleta(url, titulo) {
            abrirJanelaFixa(`
                <h2>📷 ${titulo}</h2>
                <hr>
                <div style="text-align:center; margin-bottom:10px;">
                    <img src="${url}" style="max-width:100%; max-height:240px; border-radius:6px; border:1px solid #cbd5e1;" alt="Imagem">
                </div>
                <button onclick="abrirGaleriaImagens()" class="secondary-btn" style="padding: 10px;">⬅ Voltar</button>
            `);
        }
        // --------------------------------------------------------

        function abrirEstatisticasAcessos() {
            let acessos = JSON.parse(localStorage.getItem("angola_acessos_log")) || [];
            let htmlLogs = `<h2>📊 Utilizadores</h2><p style="font-size:0.8rem; color:#64748b;">Registos no dispositivo:</p><hr>`;
            if (acessos.length === 0) {
                htmlLogs += `<p style="font-size:0.85rem;">Sem registos.</p>`;
            } else {
                acessos.reverse().forEach((log, index) => {
                    htmlLogs += `<div class="log-box" style="background:rgba(241, 245, 249, 0.9); color:#0f172a; border:1px solid #cbd5e1;"><b>#${acessos.length - index}</b> - ${log.perfil || 'Geral'} <br><small>${log.dataHora}</small></div>`;
                });
            }
            htmlLogs += `<br><button onclick="limparLogs()" class="danger-btn" style="padding:10px;">Apagar Registos</button><button onclick="abrirSubmenuDireito()" class="secondary-btn" style="padding:10px;">Voltar</button>`;
            abrirJanelaFixa(htmlLogs);
        }

        function limparLogs() {
            localStorage.removeItem("angola_acessos_log");
            mostrarToast("Registos limpos!");
            abrirEstatisticasAcessos();
        }

        function abrirMenu() {
            abrirJanelaFixa(`
                <h2>☰ Menu</h2>
                <hr>
                <button onclick="abrirSubmenuSaude()" style="padding:10px;">🩺 Saúde</button>
                <button onclick="abrirLeitorMusica()" style="padding:10px;">🎵 Músicas</button>
                <button onclick="abrirGestorVideos()" style="padding:10px;">🎥 Vídeos</button>
                <button onclick="abrirGaleriaImagens()" style="padding:10px;">🖼️ Imagens</button>
                <button onclick="abrirChat()" style="padding:10px;">💬 Chat Dev</button>
                <br>
                <button onclick="fecharJanelaModal()" class="danger-btn" style="padding:10px;">Fechar</button>
            `);
        }

        function abrirSubmenuDireito() {
            abrirJanelaFixa(`
                <h2>⚙️ Opções</h2>
                <hr>
                <button onclick="instalarAplicativo()" style="background:#059669; padding:10px;">📥 Instalar Aplicativo</button>
                <button onclick="infoDev()" style="padding:10px;">ℹ Sobre</button>
                <button onclick="infoIban()" style="padding:10px;">💳 IBAN</button>
                <button onclick="abrirEstatisticasAcessos()" style="padding:10px;">📊 Utilizadores</button>
                <button onclick="partilharApp()" class="whatsapp-btn" style="padding:10px;">🔗 Partilhar</button>
                <button onclick="abrirAjudaFeedback()" style="padding:10px;">❓ Ajuda</button>
                <br>
                <button onclick="fecharJanelaModal()" class="danger-btn" style="padding:10px;">Fechar</button>
            `);
        }

        function partilharApp() {
            if (navigator.share) {
                navigator.share({
                    title: 'Angola 2026',
                    text: 'Confere a aplicação Angola 2026!',
                    url: window.location.href
                }).catch((error) => console.log('Erro ao partilhar:', error));
            } else {
                let textoPartilha = "Confere a aplicação Angola 2026: " + window.location.href;
                navigator.clipboard.writeText(textoPartilha).then(() => {
                    mostrarToast("Link copiado!");
                });
            }
        }

        function abrirAjudaFeedback() {
            abrirJanelaFixa(`
                <h2>❓ Ajuda</h2>
                <hr>
                <p style="font-size: 0.85rem; margin-bottom: 10px;">Consulte as informações institucionais e patrióticas.</p>
                <textarea id="textoFeedback" placeholder="Deixe a sua mensagem..." style="font-size:0.9rem; height:80px;"></textarea>
                <button onclick="enviarFeedback()" class="whatsapp-btn" style="padding:10px;">💬 Enviar WhatsApp</button>
                <br>
                <button onclick="abrirSubmenuDireito()" class="secondary-btn" style="padding:10px;">Voltar</button>
            `);
        }

        function enviarFeedback() {
            const texto = document.getElementById("textoFeedback").value.trim();
            if (texto === "") {
                mostrarToast("Escreva uma mensagem!");
                return;
            }
            let nomeUtilizador = localStorage.getItem("utilizador_nome") || "Utilizador";
            let urlZap = `https://wa.me/244944048287?text=` + encodeURIComponent(`Feedback Angola 2026\nDe: ${nomeUtilizador}\n\nMensagem: ${texto}`);
            window.open(urlZap, '_blank');
        }

        function abrirSubmenuSaude() {
            abrirJanelaFixa(`
                <h2>🩺 Saúde</h2>
                <hr>
                <button onclick="calcMed()" style="padding:10px;">💊 Dosagens</button>
                <button onclick="infoSaude('🦟 Paludismo', 'Febre alta e calafrios. Use redes mosqueteiras.')" style="padding:10px;">🦟 Paludismo</button>
                <button onclick="infoSaude('🎗 HIV/SIDA', 'Prevenção com preservativos e testagem regular.')" style="padding:10px;">🎗 HIV/SIDA</button>
                <br>
                <button onclick="abrirMenu()" class="secondary-btn" style="padding:10px;">Voltar</button>
            `);
        }

        function abrirChat() {
            abrirJanelaFixa(`
                <h2>💬 Chat Dev</h2>
                <div class="chat-box" id="chatHistorico" style="background:#f1f5f9; border:1px solid #cbd5e1;"></div>
                <input type="text" id="mensagemInput" placeholder="Escreve..." style="font-size:0.9rem; padding:10px;">
                <button onclick="enviarMensagemChat()" style="padding:10px;">Enviar</button>
                <button onclick="abrirMenu()" class="secondary-btn" style="padding:10px;">Voltar</button>
            `);
            carregarConversasBD();
        }

        function carregarConversasBD() {
            const historicoDiv = document.getElementById("chatHistorico");
            if (!historicoDiv) return;
            let conversas = JSON.parse(localStorage.getItem("angola_chat_db")) || [];
            if (conversas.length === 0) {
                historicoDiv.innerHTML = `<div style="color:#64748b; font-size:0.85rem;">Escreva uma mensagem.</div>`;
                return;
            }
            historicoDiv.innerHTML = "";
            conversas.forEach(msg => {
                historicoDiv.innerHTML += `<div style="background:${msg.tipo === 'user' ? '#1d4ed8' : '#e2e8f0'}; color:${msg.tipo === 'user' ? '#fff' : '#0f172a'}; padding:6px 10px; border-radius:6px; font-size:0.85rem; margin-bottom:4px;">${msg.texto}</div>`;
            });
            historicoDiv.scrollTop = historicoDiv.scrollHeight;
        }

        function enviarMensagemChat() {
            const input = document.getElementById("mensagemInput");
            const texto = input.value.trim();
            if (texto === "") return;
            let conversas = JSON.parse(localStorage.getItem("angola_chat_db")) || [];
            conversas.push({ tipo: "user", texto: texto });
            conversas.push({ tipo: "dev", texto: "Mensagem guardada! Podes enviar para o WhatsApp." });
            localStorage.setItem("angola_chat_db", JSON.stringify(conversas));
            input.value = "";
            carregarConversasBD();
            let nomeUtilizador = localStorage.getItem("utilizador_nome") || "Utilizador";
            let zapUrl = `https://wa.me/244944048287?text=` + encodeURIComponent(`Mensagem de ${nomeUtilizador}: ${texto}`);
            const historicoDiv = document.getElementById("chatHistorico");
            historicoDiv.innerHTML += `<button class="whatsapp-btn" onclick="window.open('${zapUrl}', '_blank')" style="padding:8px; font-size:0.8rem; margin-top:4px;">💬 Enviar para o WhatsApp</button>`;
            historicoDiv.scrollTop = historicoDiv.scrollHeight;
        }

        function calcMed() {
            abrirJanelaFixa(`
                <h2>💊 Dosagens</h2>
                <hr>
                <input type="number" id="peso" placeholder="Peso (kg)" style="padding:10px; font-size:0.9rem;">
                <input type="number" id="dose" placeholder="Dose (mg/kg)" style="padding:10px; font-size:0.9rem;">
                <input type="number" id="conc" placeholder="Concentração (mg/ml)" style="padding:10px; font-size:0.9rem;">
                <button onclick="executarCalculo()" style="padding:10px;">Calcular</button>
                <button onclick="abrirSubmenuSaude()" class="secondary-btn" style="padding:10px;">Voltar</button>
            `);
        }

        function executarCalculo() {
            const peso = parseFloat(document.getElementById("peso").value);
            const dose = parseFloat(document.getElementById("dose").value);
            const conc = parseFloat(document.getElementById("conc").value);
            if (!isNaN(peso) && !isNaN(dose)) {
                let total = peso * dose;
                let res = `<h2>📊 Resultado</h2><hr><p><b>Dose:</b> ${total.toFixed(2)} mg</p>`;
                if (!isNaN(conc) && conc > 0) res += `<p><b>Volume:</b> ${(total/conc).toFixed(2)} ml</p>`;
                res += `<br><button onclick="calcMed()" style="padding:10px;">Novo</button><button onclick="abrirSubmenuSaude()" class="secondary-btn" style="padding:10px;">Voltar</button>`;
                abrirJanelaFixa(res);
            } else {
                mostrarToast("Preencha valores válidos!");
            }
        }

        function infoSaude(titulo, msg) {
            abrirJanelaFixa(`<h2>${titulo}</h2><hr><p style="font-size:0.9rem;">${msg}</p><br><button onclick="abrirSubmenuSaude()" class="secondary-btn" style="padding:10px;">Voltar</button>`);
        }

        function infoDev() {
            let meuNomeCadastrado = localStorage.getItem("utilizador_nome") || "Utilizador";
            abrirJanelaFixa(`
                <h2>👨‍💻 Desenvolvedor</h2>
                <hr><p style="font-size:0.9rem;"><b>Nome:</b> ${MEU_TITULAR}<br><b>Contacto:</b> ${MEU_TELEFONE}</p>
                <button class="whatsapp-btn" onclick="window.open('https://wa.me/244944048287?text=` + encodeURIComponent(`Olá Artur, sou o/a ${meuNomeCadastrado}.`) + `', '_blank')" style="padding:10px;">💬 WhatsApp</button>
                <button class="call-btn" onclick="window.location.href='tel:${MEU_TELEFONE}'" style="padding:10px;">📞 Ligar</button>
                <br><br><button onclick="abrirSubmenuDireito()" class="secondary-btn" style="padding:10px;">Voltar</button>
            `);
        }

        function infoIban() {
            abrirJanelaFixa(`<h2>💳 IBAN</h2><hr><div class="iban-box" style="background:rgba(241, 245, 249, 0.9); color:#1e3a8a; border:1px dashed #cbd5e1;">${MEU_IBAN}</div><br><button onclick="abrirSubmenuDireito()" class="secondary-btn" style="padding:10px;">Voltar</button>`);
        }
    </script>
</body>
</html>
